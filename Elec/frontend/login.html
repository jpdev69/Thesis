<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EnergyAI Forecasting Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #02160c;
            --card-bg: rgba(2, 22, 12, 0.38);
            --card-border: rgba(52, 232, 154, 0.22);
            --accent-primary: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #aef0c0;
            --text-muted: #64748b;
            --input-bg: rgba(2, 30, 18, 0.45);
            --input-border: rgba(52, 232, 154, 0.2);
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: rgba(239, 68, 68, 0.4);
            --error-text: #fca5a5;
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-border: rgba(16, 185, 129, 0.4);
            --success-text: #6ee7b7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        #scene {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(16, 185, 129, 0.08);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .logo-box {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            box-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 16px;
        }

        .logo-box h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .logo-box p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .public-home-link {
            position: fixed;
            top: 22px;
            left: 24px;
            z-index: 2;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .public-home-link:hover {
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .form-control {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: rgba(30, 41, 59, 0.9);
        }

        .form-control:focus + svg {
            color: var(--accent-primary);
        }

        /* Bot Detection Honeypot (Hidden) */
        .hp-trap {
            opacity: 0;
            position: absolute;
            top: 0;
            left: 0;
            height: 0;
            width: 0;
            z-index: -1;
            pointer-events: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 14px var(--accent-glow);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .form-toggle-bar {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-toggle-bar a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .form-toggle-bar a:hover {
            text-decoration: underline;
        }

        .admin-link-box {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
            text-align: center;
        }

        .admin-link-box a {
            color: #38bdf8;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .admin-link-box a:hover {
            text-decoration: underline;
        }

        .alert-banner {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.5;
        }

        .alert-banner.error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
        }

        .alert-banner.success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .alert-banner.warning {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fde047;
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <a class="public-home-link" href="index.html">&larr; Public home</a>

    <div class="login-card">
        <div class="logo-box">
            <div class="logo-icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="url(#boltGrad)" stroke="#10b981" stroke-width="0.5"/>
                    <defs>
                        <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#a7f3d0"/>
                            <stop offset="50%" stop-color="#10b981"/>
                            <stop offset="100%" stop-color="#047857"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>EnergyAI Engine</h1>
            <p id="subTitleText">Sign in to access your energy forecasting workspace</p>
        </div>

        <div id="alertBanner" class="alert-banner"></div>

        <!-- Bot Detection Honeypot (Hidden) -->
        <input type="text" name="website_hp" id="website_hp" class="hp-trap" tabindex="-1" autocomplete="off">

        <!-- Sign In Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="loginEmail" class="form-control" placeholder="name@campus.edu" required autocomplete="email">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>

            <button type="submit" id="loginSubmitBtn" class="btn-submit">
                <span>Sign In</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>

            <div class="form-toggle-bar">
                Don't have an account? <a href="#" onclick="switchForm('signup'); return false;">Request Account Access</a>
            </div>
            <div class="admin-link-box">
                <a href="admin.html">System Administrator Portal →</a>
            </div>
        </form>

        <!-- Sign Up Form -->
        <form id="signupForm" style="display: none;">
            <div class="form-group">
                <label for="signupName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="signupName" class="form-control" placeholder="Campus Energy Manager" required>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="signupEmail">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="signupEmail" class="form-control" placeholder="user@campus.edu" required>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="signupPassword" class="form-control" placeholder="Min. 6 characters" required minlength="6">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>

            <button type="submit" id="signupSubmitBtn" class="btn-submit">
                <span>Submit Account Registration</span>
            </button>

            <div class="form-toggle-bar">
                Already have an approved account? <a href="#" onclick="switchForm('login'); return false;">Sign In</a>
            </div>
        </form>
    </div>

    <script src="config.js?v=20260806"></script>
    <script>
        const AUTH_KEYS = {
            users: 'users',
            currentUser: 'currentUser',
            returnTo: 'returnTo',
        };

        const ADMIN_EMAIL = 'admin@energy.ai';

        function safeReadJson(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return fallback;
                return JSON.parse(raw);
            } catch (_) {
                return fallback;
            }
        }

        function safeWriteJson(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        function normalizeUser(user) {
            if (!user || typeof user !== 'object') return null;
            const email = String(user.email || '').trim().toLowerCase();
            if (!email) return null;

            const role = String(user.role || (email === ADMIN_EMAIL ? 'admin' : 'user')).trim().toLowerCase();
            return {
                id: user.id || `USR-${Math.floor(Math.random() * 89999 + 10000)}`,
                name: String(user.name || 'User').trim() || 'User',
                email,
                password: String(user.password || ''),
                status: String(user.status || 'pending').trim().toLowerCase(),
                role,
                created: user.created || new Date().toISOString(),
                lastLogin: user.lastLogin || null,
            };
        }

        function loadUsers() {
            const users = safeReadJson(AUTH_KEYS.users, []);
            if (!Array.isArray(users)) return [];
            const normalized = users.map(normalizeUser).filter(Boolean);
            if (normalized.length !== users.length) {
                safeWriteJson(AUTH_KEYS.users, normalized);
            }
            return normalized;
        }

        function saveUsers(users) {
            safeWriteJson(AUTH_KEYS.users, users.map(normalizeUser).filter(Boolean));
        }

        function seedDefaultUsers() {
            const users = loadUsers();
            let changed = false;

            let admin = users.find(u => u.email === ADMIN_EMAIL);
            if (!admin) {
                users.push(normalizeUser({
                    id: 'USR-10001',
                    name: 'Admin User',
                    email: ADMIN_EMAIL,
                    password: 'admin123',
                    status: 'approved',
                    role: 'admin',
                    created: new Date().toISOString(),
                }));
                changed = true;
            }

            if (users.length === 1) {
                users.push(normalizeUser({
                    id: 'USR-10002',
                    name: 'Sample Approved User',
                    email: 'user@example.edu',
                    password: 'password123',
                    status: 'approved',
                    role: 'user',
                    created: new Date().toISOString(),
                }));
                changed = true;
            }

            if (changed) {
                saveUsers(users);
            }
        }

        function validReturnPage() {
            const page = localStorage.getItem(AUTH_KEYS.returnTo) || 'dashboard.html';
            const allowed = new Set(['dashboard.html', 'analytics.html', 'reports.html', 'settings.html', 'models.html']);
            return allowed.has(page) ? page : 'dashboard.html';
        }

        function updateSubmitState(formId, buttonId, isLoading, loadingText, idleText) {
            const form = document.getElementById(formId);
            const btn = document.getElementById(buttonId);
            if (!form || !btn) return;
            const controls = form.querySelectorAll('input, button, select, textarea');
            controls.forEach(el => {
                if (el !== btn) el.disabled = isLoading;
            });
            btn.disabled = isLoading;
            btn.textContent = isLoading ? loadingText : idleText;
        }

        function showAlert(msg, type = 'error') {
            const banner = document.getElementById('alertBanner');
            banner.textContent = msg;
            banner.className = `alert-banner ${type}`;
            banner.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertBanner').style.display = 'none';
        }

        function switchForm(target) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const title = document.getElementById('subTitleText');

            hideAlert();

            if (target === 'signup') {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                title.textContent = 'Register an account for admin approval';
            } else {
                signupForm.style.display = 'none';
                loginForm.style.display = 'block';
                title.textContent = 'Sign in to access your energy forecasting workspace';
            }
        }

        // ============================================================
        // SIGNUP SUBMISSION
        // ============================================================
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();

            // Honeypot Trap Check
            if (document.getElementById('website_hp').value !== '') {
                showAlert('Bot activity detected. Submission blocked.', 'error');
                return;
            }

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();
            const password = document.getElementById('signupPassword').value;

            // Retrieve registered users
            const users = loadUsers();

            if (users.some(u => u.email.toLowerCase() === email)) {
                showAlert('An account with this email already exists.', 'error');
                return;
            }

            // Add new user in 'pending' status
            users.push(normalizeUser({
                id: 'USR-' + Math.floor(Math.random() * 89999 + 10000),
                name,
                email,
                password,
                status: 'pending',
                role: 'user',
                created: new Date().toISOString(),
            }));

            saveUsers(users);

            showAlert('Account registered successfully! Pending Administrator approval.', 'success');
            document.getElementById('signupForm').reset();

            setTimeout(() => {
                switchForm('login');
            }, 2500);
        });

        // ============================================================
        // LOGIN SUBMISSION
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            // Honeypot Trap
            if (document.getElementById('website_hp').value !== '') {
                showAlert('Bot activity detected. Access denied.', 'error');
                return;
            }

            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            const users = loadUsers();
            const user = users.find(u => u.email.toLowerCase() === email && u.password === password);

            if (!user) {
                showAlert('Invalid email or password.', 'error');
                return;
            }

            // Check User Status
            if (user.status === 'pending') {
                showAlert('Your account is awaiting Administrator approval. Please check back later.', 'warning');
                return;
            }

            if (user.status === 'rejected') {
                showAlert('Access Denied. Your account registration was rejected by the Administrator.', 'error');
                return;
            }

            // Successful Login
            user.lastLogin = new Date().toISOString();
            saveUsers(users);
            safeWriteJson(AUTH_KEYS.currentUser, {
                id: user.id,
                name: user.name,
                email: user.email,
                status: user.status,
                role: user.role,
            });
            showAlert('Login successful! Redirecting to workspace...', 'success');

            const returnTo = user.role === 'admin' ? 'models.html' : validReturnPage();
            localStorage.removeItem(AUTH_KEYS.returnTo);

            setTimeout(() => {
                window.location.href = returnTo;
            }, 1000);
        });

        seedDefaultUsers();

        const requestedMode = new URLSearchParams(window.location.search).get('mode');
        switchForm(requestedMode === 'signup' ? 'signup' : 'login');
    </script>
    <script>
        (() => {
            const canvas = document.getElementById('scene');
            const context = canvas.getContext('2d', { alpha: true });
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            let width = 0;
            let height = 0;
            let animationFrame = 0;
            let startTime = performance.now();

            function resize() {
                const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.round(width * ratio);
                canvas.height = Math.round(height * ratio);
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                context.setTransform(ratio, 0, 0, ratio, 0, 0);
            }

            function draw(timestamp) {
                const time = reducedMotion.matches ? 0 : (timestamp - startTime) / 1000;
                context.clearRect(0, 0, width, height);

                const gradient = context.createLinearGradient(0, height * 0.35, 0, height);
                gradient.addColorStop(0, 'rgba(16, 185, 129, 0)');
                gradient.addColorStop(0.55, 'rgba(16, 185, 129, 0.14)');
                gradient.addColorStop(1, 'rgba(6, 182, 212, 0)');

                context.lineWidth = 1;
                context.strokeStyle = gradient;
                const lines = width < 700 ? 10 : 16;
                const points = width < 700 ? 28 : 44;

                for (let row = 0; row < lines; row += 1) {
                    context.beginPath();
                    for (let point = 0; point <= points; point += 1) {
                        const x = (point / points) * width;
                        const baseY = height * 0.5 + row * (height * 0.03);
                        const wave = Math.sin(point * 0.34 + row * 0.42 + time * 0.32) * (9 + row * 0.6);
                        const swell = Math.sin(point * 0.1 - time * 0.18) * 16;
                        const y = baseY + wave + swell;
                        if (point === 0) context.moveTo(x, y);
                        else context.lineTo(x, y);
                    }
                    context.stroke();
                }

                if (!reducedMotion.matches && !document.hidden) {
                    animationFrame = requestAnimationFrame(draw);
                }
            }

            function restart() {
                cancelAnimationFrame(animationFrame);
                draw(performance.now());
            }

            window.addEventListener('resize', () => {
                resize();
                restart();
            }, { passive: true });
            reducedMotion.addEventListener?.('change', restart);
            document.addEventListener('visibilitychange', restart);
            resize();
            restart();
        })();
    </script>
</body>
</html>
